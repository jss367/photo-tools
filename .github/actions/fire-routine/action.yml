name: Fire Claude Code routine
description: POST to the PR fix agent routine's /fire endpoint with a text payload.

inputs:
  url:
    description: Routine /fire URL (from claude.ai/code/routines)
    required: true
  token:
    description: Routine bearer token
    required: true
  payload:
    description: Plain-text payload sent as the `text` field
    required: true
  repo:
    description: Repository containing the PR, in owner/name form.
    required: false
  pr:
    description: PR number to verify immediately before firing the routine.
    required: false
  expected-head:
    description: >-
      Optional full or abbreviated head SHA associated with the triggering
      event. The routine is not fired if the PR has moved to another head.
    required: false
  github-token:
    description: GitHub token used for the live PR-state check.
    required: false
  max-review-fix-rounds:
    description: >-
      Optional cap on prior commits carrying this PR's automated review-fix
      marker. Zero disables the workflow-level cap (for explicit human runs).
    required: false
    default: "0"
  allow-missing:
    description: Exit successfully when routine credentials are missing.
    required: false
    default: "false"

outputs:
  fired:
    description: "'true' only when the routine provider accepts the POST."
    value: ${{ steps.fire.outputs.fired }}

runs:
  using: composite
  steps:
    - name: POST to routine
      id: fire
      shell: bash
      env:
        ROUTINE_URL: ${{ inputs.url }}
        ROUTINE_TOKEN: ${{ inputs.token }}
        ROUTINE_PAYLOAD: ${{ inputs.payload }}
        ALLOW_MISSING: ${{ inputs.allow-missing }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
        EXPECTED_HEAD: ${{ inputs.expected-head }}
        MAX_REVIEW_FIX_ROUNDS: ${{ inputs.max-review-fix-rounds }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        echo "fired=false" >> "$GITHUB_OUTPUT"

        # Event payloads describe the PR when an event was queued, not when
        # this forwarder finally runs. Re-read live state immediately before
        # consuming a routine invocation. This makes stale review deliveries
        # and all queued work for merged/closed PRs silent no-ops.
        if [[ -n "${PR}" ]]; then
          if [[ -z "${REPO}" || -z "${GH_TOKEN}" ]]; then
            echo "::error::repo and github-token are required when pr is set."
            exit 1
          fi

          pr_json=$(gh pr view "${PR}" --repo "${REPO}" \
            --json state,headRefOid,headRepositoryOwner,headRepository)
          state=$(jq -r '.state' <<< "${pr_json}")
          current_head=$(jq -r '.headRefOid' <<< "${pr_json}")
          head_repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<< "${pr_json}")

          if [[ "${state}" != "OPEN" ]]; then
            echo "PR #${PR} is ${state}; skipping stale routine fire."
            exit 0
          fi
          if [[ "${head_repo}" != "${REPO}" ]]; then
            echo "PR #${PR} comes from fork ${head_repo}; skipping routine fire."
            exit 0
          fi
          if [[ -n "${EXPECTED_HEAD}" && "${current_head}" != "${EXPECTED_HEAD}"* ]]; then
            echo "PR #${PR} moved from ${EXPECTED_HEAD} to ${current_head}; skipping stale routine fire."
            exit 0
          fi

          if [[ "${MAX_REVIEW_FIX_ROUNDS}" -gt 0 ]]; then
            prior_rounds=$(gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
              | jq -s --arg marker "[pr-agent-review-fix:${PR}]" '
                  [ .[][] | select(.commit.message | contains($marker)) ]
                  | length')
            if [[ "${prior_rounds}" -ge "${MAX_REVIEW_FIX_ROUNDS}" ]]; then
              echo "PR #${PR} already used ${prior_rounds} automated review-fix rounds; human review required."
              gh label create pr-agent-needs-human --repo "${REPO}" \
                --color B60205 \
                --description "Automated PR repair stopped; human review required" \
                || true
              gh pr edit "${PR}" --repo "${REPO}" \
                --add-label pr-agent-needs-human
              exit 0
            fi
          fi

          ROUTINE_PAYLOAD="${ROUTINE_PAYLOAD}"$'\n'"Expected head: ${current_head}"
        fi

        if [[ -z "${ROUTINE_URL}" || -z "${ROUTINE_TOKEN}" ]]; then
          if [[ "${ALLOW_MISSING}" == "true" ]]; then
            echo "::notice::CLAUDE_ROUTINE_URL or CLAUDE_ROUTINE_TOKEN is missing; skipping routine fire."
            exit 0
          fi

          echo "::error::CLAUDE_ROUTINE_URL or CLAUDE_ROUTINE_TOKEN secret is missing."
          exit 1
        fi

        # Build JSON safely so embedded newlines, quotes, and backticks in
        # review text survive without shell interpolation hazards.
        body=$(jq -n --arg text "${ROUTINE_PAYLOAD}" '{text: $text}')

        response=$(mktemp)
        status=$(curl -sS -o "${response}" -w '%{http_code}' \
          -X POST "${ROUTINE_URL}" \
          -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
          -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
          -H "anthropic-version: 2023-06-01" \
          -H "Content-Type: application/json" \
          -d "${body}")

        echo "Routine response (HTTP ${status}):"
        cat "${response}"
        echo

        if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
          if [[ "${status}" -ge 500 && "${status}" -le 599 ]]; then
            echo "::warning::Routine fire skipped because the routine provider returned a server error."
            exit 0
          fi
          error_type=$(jq -r '.error.type // empty' < "${response}" || true)
          if [[ "${status}" == "429" && "${error_type}" == "rate_limit_error" ]]; then
            echo "::warning::Routine fire skipped because the routine provider returned a rate-limit/quota error."
            exit 0
          fi
          echo "::error::Routine fire failed with status ${status}"
          exit 1
        fi

        echo "fired=true" >> "$GITHUB_OUTPUT"

        session_url=$(jq -r '.claude_code_session_url // empty' < "${response}")
        if [[ -n "${session_url}" ]]; then
          echo "::notice::Routine session: ${session_url}"
        fi
