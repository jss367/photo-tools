name: Check PR merge readiness
description: >-
  Verify live PR state, approved head, repository/base constraints, child PRs,
  resolution of every current review thread, and a successful Tests run for
  the exact head before a synchronous merge.

inputs:
  repo:
    description: Repository in owner/name form.
    required: true
  pr:
    description: Pull request number.
    required: true
  token:
    description: GitHub token with read access to the PR.
    required: true
  approved-head:
    description: Full or abbreviated head SHA authorized by the human reviewer.
    required: true
  authorized-at:
    description: RFC 3339 timestamp of the approval or exact merge command.
    required: true
  approval-id:
    description: Review ID when authorization came from an approval.
    required: false
  merge-comment-id:
    description: Issue-comment ID when authorization came from /merge.
    required: false

outputs:
  ready:
    description: "'true' only when every merge precondition is satisfied."
    value: ${{ steps.check.outputs.ready }}
  head-sha:
    description: Current full PR head SHA.
    value: ${{ steps.check.outputs.head_sha }}
  title:
    description: Current PR title.
    value: ${{ steps.check.outputs.title }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr }}
        APPROVED_HEAD: ${{ inputs.approved-head }}
        AUTHORIZED_AT: ${{ inputs.authorized-at }}
        APPROVAL_ID: ${{ inputs.approval-id }}
        MERGE_COMMENT_ID: ${{ inputs.merge-comment-id }}
      run: |
        set -euo pipefail

        echo "ready=false" >> "$GITHUB_OUTPUT"

        pr_json=$(gh pr view "$PR" --repo "$REPO" \
          --json state,headRefOid,headRefName,baseRefName,title,reviewDecision,headRepositoryOwner,headRepository)
        state=$(jq -r '.state' <<< "$pr_json")
        head_sha=$(jq -r '.headRefOid' <<< "$pr_json")
        head_ref=$(jq -r '.headRefName' <<< "$pr_json")
        base_ref=$(jq -r '.baseRefName' <<< "$pr_json")
        title=$(jq -r '.title' <<< "$pr_json")
        review_decision=$(jq -r '.reviewDecision' <<< "$pr_json")
        head_repo=$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' <<< "$pr_json")

        title_delimiter="PR_AGENT_TITLE_$(openssl rand -hex 16)"
        while grep -Fqx "$title_delimiter" <<< "$title"; do
          title_delimiter="PR_AGENT_TITLE_$(openssl rand -hex 16)"
        done
        {
          echo "head_sha=${head_sha}"
          echo "title<<${title_delimiter}"
          echo "${title}"
          echo "${title_delimiter}"
        } >> "$GITHUB_OUTPUT"

        if [[ "$state" != "OPEN" ]]; then
          echo "PR #${PR} is ${state}; merge authorization is stale."
          exit 0
        fi
        if [[ "$head_sha" != "$APPROVED_HEAD"* ]]; then
          echo "PR #${PR} head ${head_sha} does not match approved head ${APPROVED_HEAD}."
          exit 0
        fi
        if [[ -n "$APPROVAL_ID" && -n "$MERGE_COMMENT_ID" ]]; then
          echo "PR #${PR} has ambiguous merge authorization inputs."
          exit 0
        elif [[ -n "$APPROVAL_ID" ]]; then
          if ! approval=$(gh api "repos/${REPO}/pulls/${PR}/reviews/${APPROVAL_ID}"); then
            echo "Approval ${APPROVAL_ID} no longer exists."
            exit 0
          fi
          approval_state=$(jq -r '.state' <<< "$approval")
          approval_head=$(jq -r '.commit_id' <<< "$approval")
          approval_time=$(jq -r '.submitted_at' <<< "$approval")
          if [[ "$approval_state" != "APPROVED" \
            || "$approval_head" != "$head_sha" \
            || "$approval_time" != "$AUTHORIZED_AT" ]]; then
            echo "Approval ${APPROVAL_ID} is no longer active for PR #${PR} head ${head_sha}."
            exit 0
          fi
        elif [[ -n "$MERGE_COMMENT_ID" ]]; then
          if ! merge_comment=$(gh api "repos/${REPO}/issues/comments/${MERGE_COMMENT_ID}"); then
            echo "Merge command ${MERGE_COMMENT_ID} no longer exists."
            exit 0
          fi
          merge_body=$(jq -r '.body' <<< "$merge_comment")
          merge_time=$(jq -r '.created_at' <<< "$merge_comment")
          if [[ ! "$merge_body" =~ ^/merge[[:space:]]+([0-9a-fA-F]{7,40})[[:space:]]*$ ]]; then
            echo "Merge command ${MERGE_COMMENT_ID} is no longer valid."
            exit 0
          fi
          merge_head=$(tr '[:upper:]' '[:lower:]' <<< "${BASH_REMATCH[1]}")
          if [[ "$head_sha" != "$merge_head"* || "$merge_time" != "$AUTHORIZED_AT" ]]; then
            echo "Merge command ${MERGE_COMMENT_ID} no longer authorizes PR #${PR} head ${head_sha}."
            exit 0
          fi
        else
          echo "PR #${PR} has no live approval or merge-command authorization."
          exit 0
        fi
        if [[ "$base_ref" != "main" ]]; then
          echo "PR #${PR} targets ${base_ref}, not main."
          exit 0
        fi
        if [[ "$head_repo" != "$REPO" ]]; then
          echo "PR #${PR} comes from fork ${head_repo}; automatic merge is disabled."
          exit 0
        fi
        if [[ "$review_decision" == "CHANGES_REQUESTED" ]]; then
          echo "PR #${PR} currently has changes requested."
          exit 0
        fi

        # An approval or merge command authorizes the reviewed state, not all
        # future feedback on the same commit. A later accepted top-level
        # comment must be reconciled and followed by fresh authorization.
        newer_comment_feedback=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
          --slurp | jq --arg authorized_at "$AUTHORIZED_AT" '
            (add // [])
            | [ .[]
                | select(.created_at >= $authorized_at)
                | select(
                    .author_association == "OWNER"
                    or .author_association == "COLLABORATOR"
                    or .user.login == "chatgpt-codex-connector[bot]"
                  )
                | select(.body != "+1" and .body != "👍")
                | select(.body | endswith("<!-- pr-agent-generated -->") | not)
                | select(.body | endswith("Generated by [Claude Code](https://claude.ai/code)_") | not)
                | select(
                    .body
                    | test("^/merge[[:space:]]+[0-9a-fA-F]{7,40}[[:space:]]*$")
                    | not
                  )
              ]
            | length')

        newer_review_feedback=$(gh api --paginate "repos/${REPO}/pulls/${PR}/reviews" \
          --slurp | jq --arg authorized_at "$AUTHORIZED_AT" '
            (add // [])
            | [ .[]
                | select(.submitted_at >= $authorized_at)
                | select(.state == "COMMENTED" or .state == "CHANGES_REQUESTED")
                | select(
                    .author_association == "OWNER"
                    or .author_association == "COLLABORATOR"
                    or .user.login == "chatgpt-codex-connector[bot]"
                  )
                | select((.body // "") | test("[^[:space:]]"))
                | select((.body // "") | endswith("<!-- pr-agent-generated -->") | not)
                | select((.body // "") | endswith("Generated by [Claude Code](https://claude.ai/code)_") | not)
              ]
            | length')

        newer_feedback=$((newer_comment_feedback + newer_review_feedback))
        if [[ "$newer_feedback" -gt 0 ]]; then
          echo "PR #${PR} has ${newer_feedback} actionable feedback item(s) at or after its merge authorization."
          exit 0
        fi

        child_count=$(gh pr list --repo "$REPO" --base "$head_ref" --state open \
          --json number --jq 'length')
        if [[ "$child_count" -gt 0 ]]; then
          echo "PR #${PR} still has ${child_count} open child PR(s)."
          exit 0
        fi

        owner="${REPO%/*}"
        name="${REPO#*/}"
        cursor=""
        unresolved=0
        while :; do
          after=""
          if [[ -n "$cursor" ]]; then
            after=", after: \"$cursor\""
          fi
          data=$(gh api graphql -f query="
            query(\$owner:String!, \$name:String!, \$pr:Int!) {
              repository(owner:\$owner, name:\$name) {
                pullRequest(number:\$pr) {
                  reviewThreads(first:100${after}) {
                    nodes { isResolved isOutdated }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }" -F owner="$owner" -F name="$name" -F pr="$PR")

          page_unresolved=$(jq '
            [ .data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false and .isOutdated == false) ]
            | length' <<< "$data")
          unresolved=$((unresolved + page_unresolved))
          has_next=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<< "$data")
          cursor=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor' <<< "$data")
          [[ "$has_next" == "true" && -n "$cursor" && "$cursor" != "null" ]] || break
        done

        if [[ "$unresolved" -gt 0 ]]; then
          echo "PR #${PR} has ${unresolved} unresolved current review thread(s)."
          exit 0
        fi

        test_runs=$(gh run list --repo "$REPO" --workflow Tests \
          --branch "$head_ref" --event pull_request --limit 20 \
          --json headSha,status,conclusion,createdAt,url)
        latest_test=$(jq -c --arg head "$head_sha" '
          [ .[] | select(.headSha == $head) ]
          | sort_by(.createdAt)
          | last // empty' <<< "$test_runs")
        if [[ -z "$latest_test" ]]; then
          echo "PR #${PR} has no Tests run for head ${head_sha}."
          exit 0
        fi
        test_status=$(jq -r '.status' <<< "$latest_test")
        test_conclusion=$(jq -r '.conclusion' <<< "$latest_test")
        test_url=$(jq -r '.url' <<< "$latest_test")
        if [[ "$test_status" != "completed" || "$test_conclusion" != "success" ]]; then
          echo "PR #${PR} Tests are ${test_status}/${test_conclusion} for ${head_sha}: ${test_url}"
          exit 0
        fi

        echo "ready=true" >> "$GITHUB_OUTPUT"
        echo "PR #${PR} is merge-ready at ${head_sha}."
